name: Deploy - MFE Cadastro

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mfe_cadastro_u/**'
      - '.github/workflows/deploy-mfe-cadastro.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mfe-cadastro
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e testar o MFE Cadastro
        run: mvn -B -f mfe_cadastro_u/pom.xml clean package

      - name: Verificar o JAR gerado
        run: test -f mfe_cadastro_u/target/fitlife-mfe-cadastro-1.0.0.jar

      - name: Publicar no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_MFE_CADASTRO }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_MFE_CADASTRO }}
          package: mfe_cadastro_u/target/fitlife-mfe-cadastro-1.0.0.jar
