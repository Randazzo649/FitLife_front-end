
# Build and deploy MFE Cadastro to Azure App Service

name: Build and deploy MFE Cadastro - FitLife

on:
  push:
    branches:
      - main
    paths:
    - 'mfe_cadastro_u/**'
    - '.github/workflows/**'
    - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven
          cache-dependency-path: mfe_cadastro_u/pom.xml

      - name: Build MFE Cadastro
        run: mvn -B -f mfe_cadastro_u/pom.xml clean package

      - name: Prepare executable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy

          mapfile -t jars < <(
            find mfe_cadastro_u/target -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-tests.jar' \
              ! -name '*-plain.jar'
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Esperado exatamente um JAR executável; encontrados: ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "${jars[0]}" deploy/app.jar
          echo "JAR preparado: ${jars[0]}"

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_41DD5FA37A2D4C2EAF89C37FA58D4D9E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E6BA93CB0BBD4BD3A9444318CA656493 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5902352357824848A49FF8BA560C98B7 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FitlifeMFECadastroUsuario'
          slot-name: 'Production'
          package: './deploy/app.jar'
