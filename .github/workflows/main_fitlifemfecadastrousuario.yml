
# Build and deploy MFE Cadastro to Azure App Service

name: Build and deploy MFE Cadastro - FitLife

on:
  push:
    branches:
      - main
    paths:
      - 'mfe_cadastro_u/**'
      - 'pom.xml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build MFE Cadastro
        run: mvn -B -f mfe_cadastro_u/pom.xml clean package

      - name: Prepare executable JAR
        shell: bash
        run: |
          JAR_FILE="$(find mfe_cadastro_u/target \
            -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -print -quit)"

          if [ -z "$JAR_FILE" ]; then
            echo "Nenhum JAR encontrado para o MFE Cadastro."
            exit 1
          fi

          cp "$JAR_FILE" app.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: app.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: ./artifact

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_41DD5FA37A2D4C2EAF89C37FA58D4D9E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E6BA93CB0BBD4BD3A9444318CA656493 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5902352357824848A49FF8BA560C98B7 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FitlifeMFECadastroUsuario'
          slot-name: 'Production'
          package: './artifact/app.jar'
